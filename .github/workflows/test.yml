name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: plugins/collaborative-notes
        shell: bash
        run: node --test test/*.test.mjs
      - name: Install Claude Code (for plugin validation only)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and the marketplace
        shell: bash
        run: |
          claude plugin validate plugins/collaborative-notes
          claude plugin validate .
